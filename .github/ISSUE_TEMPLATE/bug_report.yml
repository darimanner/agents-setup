name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please remove tokens, keys and other secrets from anything you paste.
  - type: input
    id: version
    attributes:
      label: agents-setup version
      description: Output of `npx agents-setup --version`
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex
        - OpenCode
        - Hermes Agent
        - Other (agent mode)
    validations:
      required: true
  - type: input
    id: agent-version
    attributes:
      label: Agent version
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or request
      description: The CLI command you ran, or what you asked your agent
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output and logs
      render: text
